<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <defs>
    <filter id="shadow-mejora" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="ref-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(100, 95)">
    <!-- Reflejo inferior -->
    <path d="M -65 82 A 75 14 0 0 0 65 82" fill="none" stroke="url(#ref-orange)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Círculo base -->
    <circle cx="0" cy="0" r="78" fill="#FFFFFF" filter="url(#shadow-mejora)"/>
    
    <!-- Anillo exterior -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#E2E8F0" stroke-width="7"/>
    <path d="M -74 0 A 74 74 0 0 1 74 0" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Ícono -->
    <g transform="translate(0, -12)">
      <rect x="-21" y="4" width="7" height="15" rx="1.5" fill="#FF6B00"/>
      <rect x="-10" y="-3" width="7" height="22" rx="1.5" fill="#FF6B00"/>
      <rect x="1" y="-10" width="7" height="29" rx="1.5" fill="#FF6B00"/>
      <path d="M -23 10 Q -6 -6 16 -20" fill="none" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 7 -21 L 19 -21 L 19 -9" fill="none" stroke="#FF6B00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(14, 10)">
        <circle cx="0" cy="0" r="5" fill="none" stroke="#FF6B00" stroke-width="3"/>
        <path d="M 0 -9 L 0 -6 M 0 6 L 0 9 M -9 0 L -6 0 M 6 0 L 9 0 M -6 -6 L -4 -4 M 4 4 L 6 6 M -6 6 L -4 4 M 4 -4 L 6 -6" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Texto -->
    <text x="0" y="48" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" fill="#FF6B00" text-anchor="middle" letter-spacing="1.5">MEJORA</text>
  </g>
</svg>
