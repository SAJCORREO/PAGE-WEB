<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="100%" height="100%">
  <defs>
    <filter id="shadow-valores" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="ref-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C885" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00C885" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(100, 95)">
    <!-- Reflejo inferior -->
    <path d="M -65 82 A 75 14 0 0 0 65 82" fill="none" stroke="url(#ref-green)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Círculo base -->
    <circle cx="0" cy="0" r="78" fill="#FFFFFF" filter="url(#shadow-valores)"/>
    
    <!-- Anillo exterior -->
    <circle cx="0" cy="0" r="74" fill="none" stroke="#E2E8F0" stroke-width="7"/>
    <path d="M -74 0 A 74 74 0 0 1 74 0" fill="none" stroke="#00C885" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Ícono -->
    <g transform="translate(0, -12)">
      <path d="M -16 -20 L 16 -20 L 16 -8 C 16 3, 9 10, 0 10 C -9 10, -16 3, -16 -8 Z" fill="#00C885"/>
      <path d="M -16 -16 C -25 -16, -24 -2, -14 0" fill="none" stroke="#00C885" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 16 -16 C 25 -16, 24 -2, 14 0" fill="none" stroke="#00C885" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -4 10 L 4 10 L 4 17 L 11 17 L 11 22 L -11 22 L -11 17 L -4 17 Z" fill="#00C885"/>
    </g>

    <!-- Texto -->
    <text x="0" y="48" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" fill="#00C885" text-anchor="middle" letter-spacing="1.5">VALORES</text>
  </g>
</svg>
